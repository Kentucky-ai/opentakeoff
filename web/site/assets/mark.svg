      <stop offset="0" stop-color="#e6c88c"/><stop offset=".55" stop-color="#c9a466"/><stop offset="1" stop-color="#a98748"/>
    </linearGradient>
    <linearGradient id="otm-r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfa06a"/><stop offset=".6" stop-color="#94784a"/><stop offset="1" stop-color="#7a6139"/>
    </linearGradient>
    <linearGradient id="otm-d" x1="0" y1="0" x2="1" y2="0">
