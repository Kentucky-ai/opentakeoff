<!doctype html><html><head><meta charset="utf-8"><title>Workspace integrity check</title><style>body{font:16px system-ui;margin:40px;max-width:980px}button{padding:12px;margin:8px}pre{padding:20px;background:#eef2f7;white-space:pre-wrap}</style></head><body><h1>Workspace integrity check</h1><p>Local development only. Reads the current browser's local project. Baselines are stored in this tab's session storage. No project changes and no uploads.</p><button id="capture">Capture baseline</button><button id="compare">Compare current project</button><pre id="result">Reading…</pre><script type="module">
import { localStore } from '../src/lib/store.js';
const KEY='premium-review-integrity-baseline';
const stable=v=>Array.isArray(v)?v.map(stable):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])])):v;
async function digest(v){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(stable(v))));return [...new Uint8Array(bytes)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function current(){const a=await localStore.loadAnnotations();const shapes=(a.shapes||[]).slice().sort((a,b)=>a.id.localeCompare(b.id));const conditions=(a.conditions||[]).slice().sort((a,b)=>a.id.localeCompare(b.id));const measurements=shapes.map(({id,sheet_id,condition_id,measure_role,verts_norm,holes_norm,computed,height_ft,height_override,arcs})=>({id,sheet_id,condition_id,measure_role,verts_norm,holes_norm,computed,height_ft,height_override,arcs}));return {shapeCount:shapes.length,conditionCount:conditions.length,materialCount:conditions.reduce((n,c)=>n+(c.materials||[]).length,0),geometryAndQuantities:await digest(measurements),conditionsAndMaterials:await digest(conditions),allShapeRecords:await digest(shapes),scales:await digest((a.sheets||[]).filter(s=>s.units_per_px).map(({sheet_id,units_per_px})=>({sheet_id,units_per_px})).sort((a,b)=>a.sheet_id.localeCompare(b.sheet_id))),markups:await digest(a.markups||[]),rfis:await digest(a.rfis||[])};}
const show=v=>document.querySelector('#result').textContent=JSON.stringify(v,null,2);
document.querySelector('#capture').onclick=async()=>{const v=await current();sessionStorage.setItem(KEY,JSON.stringify(v));show({baseline:v});};
document.querySelector('#compare').onclick=async()=>{const before=JSON.parse(sessionStorage.getItem(KEY)||'null');const after=await current();const checks=before?Object.fromEntries(Object.keys(after).map(k=>[k,before[k]===after[k]])):null;show({passed:checks?Object.values(checks).every(Boolean):null,checks,before,after});};
show(await current());
</script></body></html>
